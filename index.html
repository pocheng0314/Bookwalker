<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BW 究極省錢大師</title>
    <style>
        :root {
            --bg: #09090b;
            --surface: rgba(24, 24, 27, 0.6);
            --surface-focus: rgba(39, 39, 42, 0.8);
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: rgba(0, 234, 255, 0.4);
            --accent: #00eaff;
            --text-main: #f4f4f5;
            --text-sub: #a1a1aa;
            --text-muted: #71717a;
            --radius-lg: 24px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #18181b 0%, var(--bg) 75%);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px 16px 40px 16px;
            -webkit-font-smoothing: antialiased;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* 頂部標題 */
        .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .header svg {
            width: 20px;
            height: 20px;
            fill: var(--accent);
        }

        /* 主卡片：精緻毛玻璃 */
        .card {
            background: var(--surface);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.4);
        }

        /* 模式切換 Tabs */
        .tabs {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 3px;
            display: flex;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 9px;
            font-size: 13px;
            font-weight: 500;
            color: var(--text-sub);
            cursor: pointer;
            border-radius: 10px;
            transition: all 0.2s ease;
        }

        .tab.active {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-main);
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        /* 表單群組與間距 */
        .field-group {
            margin-bottom: 14px;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-sub);
            margin-bottom: 6px;
            letter-spacing: 0.02em;
        }

        input, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 11px 14px;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease;
            font-family: inherit;
        }

        input::placeholder { color: var(--text-muted); }

        input:focus, select:focus {
            border-color: var(--border-focus);
            background: var(--surface-focus);
            box-shadow: 0 0 0 3px rgba(0, 234, 255, 0.1);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a1a1aa' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
            padding-right: 36px;
            cursor: pointer;
        }

        select option {
            background-color: #18181b;
            color: var(--text-main);
        }

        /* 行動按鈕 */
        .btn-submit {
            width: 100%;
            margin-top: 8px;
            background: var(--text-main);
            color: var(--bg);
            border: none;
            border-radius: var(--radius-md);
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* 結果展示面板 */
        .result-panel {
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 16px;
            display: none;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 6px 0;
        }

        .result-row + .result-row {
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .result-row .val {
            font-weight: 600;
            color: var(--text-main);
        }

        .result-row .val.highlight {
            color: var(--accent);
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"/><path d="M6 6h10M6 10h10"/></svg>
            <h1>BW 究極省錢大師</h1>
        </div>

        <div class="card">
            <!-- 模式切換 -->
            <div class="tabs">
                <div id="tabEst" class="tab active" onclick="switchMode('est')">預估模式</div>
                <div id="tabRev" class="tab" onclick="switchMode('rev')">倍數反推</div>
            </div>

            <!-- 等級選擇 -->
            <div class="field-group">
                <label>會員等級 (獎勵%)</label>
                <select id="lv">
                    <option value="0">LV.0 (0%)</option>
                    <option value="1">LV.1 (1%)</option>
                    <option value="2">LV.2 (2%)</option>
                    <option value="4">LV.3 (4%)</option>
                    <option value="5">LV.4 (5%)</option>
                    <option value="7">LV.5 (7%)</option>
                    <option value="9">LV.6 (9%)</option>
                    <option value="11">LV.7 (11%)</option>
                </select>
            </div>

            <!-- 金額設定 -->
            <div class="grid-2 field-group">
                <div>
                    <label id="lblOrig">原價總計</label>
                    <input type="number" id="origPrice" placeholder="0">
                </div>
                <div>
                    <label id="lblSub">小計金額</label>
                    <input type="number" id="subTotal" placeholder="必填">
                </div>
            </div>

            <!-- 贈點與滿額 -->
            <div class="grid-2 field-group">
                <div>
                    <label id="lblBonus">活動贈點總額</label>
                    <input type="number" id="bonusPt" placeholder="0">
                </div>
                <div>
                    <label>滿額禮模式</label>
                    <select id="giftMode">
                        <option value="none">無</option>
                        <option value="fixed">固定贈點</option>
                        <option value="percent">%數回饋</option>
                    </select>
                </div>
            </div>

            <!-- 數值與折價券 -->
            <div class="grid-2 field-group">
                <div>
                    <label>模式數值</label>
                    <input type="number" id="giftVal" placeholder="0">
                </div>
                <div>
                    <label>折價券模式</label>
                    <select id="couponMode">
                        <option value="percent">折數 (%)</option>
                        <option value="cash">折抵現金</option>
                    </select>
                </div>
            </div>

            <!-- 折扣與點數折抵 -->
            <div class="grid-2 field-group">
                <div>
                    <label id="lblCoupon">折價券 (%)</label>
                    <input type="number" id="couponVal" placeholder="85">
                </div>
                <div>
                    <label>點數折抵</label>
                    <input type="number" id="pointUsed" value="0">
                </div>
            </div>

            <button class="btn-submit" onclick="calculate()">計算精算分析</button>

            <!-- 結果面板 -->
            <div id="resultPanel" class="result-panel">
                <div class="result-row">
                    <span>實付金額</span>
                    <span id="resPay" class="val highlight">$0</span>
                </div>
                <div class="result-row">
                    <span>獲得點數總計</span>
                    <span id="resPt" class="val">0 點</span>
                </div>
                <div class="result-row">
                    <span>實際折數</span>
                    <span id="resRate" class="val">0.00 折</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let mode = 'est';
        function switchMode(m) {
            mode = m;
            document.getElementById('tabEst').classList.toggle('active', m === 'est');
            document.getElementById('tabRev').classList.toggle('active', m === 'rev');
            
            if (m === 'rev') {
                document.getElementById('lblBonus').innerText = '目標點數';
                document.getElementById('bonusPt').placeholder = '輸入目標點數';
            } else {
                document.getElementById('lblBonus').innerText = '活動贈點總額';
                document.getElementById('bonusPt').placeholder = '0';
            }
        }

        function calculate() {
            const sub = parseFloat(document.getElementById('subTotal').value) || 0;
            const lvRate = parseFloat(document.getElementById('lv').value) / 100;
            const points = parseFloat(document.getElementById('pointUsed').value) || 0;
            const orig = parseFloat(document.getElementById('origPrice').value) || sub;
            
            let pay = Math.max(0, sub - points);
            let basePt = Math.floor(sub * 0.01);
            let memberPt = Math.floor(sub * lvRate);
            let totalPt = basePt + memberPt;
            let rate = orig > 0 ? (pay / orig) * 10 : 0;

            document.getElementById('resPay').innerText = '$' + pay.toFixed(0);
            document.getElementById('resPt').innerText = totalPt + ' 點';
            document.getElementById('resRate').innerText = rate.toFixed(2) + ' 折';
            
            document.getElementById('resultPanel').style.display = 'block';
        }
    </script>
</body>
</html>
