<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bookwalker精算大師 - 專業闇黑版</title>
    <style>
        :root {
            /* --- 核心配色與變數 (專業闇黑版) --- */
            --bg-color: #080808;            /* 極深黑灰 */
            --card-bg: rgba(255, 255, 255, 0.03); /* 極高透明度玻璃底層 */
            --card-border: rgba(255, 255, 255, 0.1); /* 細緻玻璃邊框 */
            --main-accent: #00eaff;          /* 亮青色，用於強調與焦點 */
            --text-primary: #ffffff;         /* 純白 */
            --text-secondary: #aaaaaa;       /* 亮灰 */
            --bw-red: #ff5555;               /* 鮮明紅 */
            --bw-red-bg: rgba(255, 85, 85, 0.15);
            
            /* --- 尺寸變數 --- */
            --radius-card: 20px;
            --radius-input: 10px;
            --space-s: 10px;
            --space-m: 15px;
            --space-l: 20px;
        }

        /* --- 全局樣式 --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% -30%, #1a1a1a 0%, var(--bg-color) 70%),
                url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.015'/%3E%3C/svg%3E");
            padding: 40px var(--space-m) 30px var(--space-m);
            margin: 0;
            color: var(--text-primary);
            min-height: 100vh;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
        }

        .app {
            max-width: 420px;
            width: 100%;
        }

        /* --- 霧面玻璃卡片 --- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-card);
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            margin-bottom: 25px;
            position: relative;
        }
        
        /* --- 標題區塊 --- */
        h2 {
            text-align: center;
            color: var(--text-primary);
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-shadow: none;
        }

        .title-icon {
            width: 22px;
            height: 22px;
            fill: var(--text-primary);
        }

        /* --- 模式切換按鈕 --- */
        .mode-switch {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 4px;
            border-radius: var(--radius-input);
            display: flex;
            margin-bottom: 20px;
        }
        .mode-btn {
            flex: 1;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        .mode-btn.active {
            background: rgba(255, 255, 255, 0.15);
            color: var(--main-accent);
            font-weight: 700;
        }

        /* --- 表單元素 --- */
        label {
            display: block;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03); 
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--radius-input);
            font-size: 15px;
            margin-bottom: 15px;
            box-sizing: border-box;
            color: var(--text-primary);
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input::placeholder { color: rgba(255,255,255,0.3); }

        input:focus, select:focus {
            outline: none;
            border-color: var(--main-accent);
            background: rgba(255, 255, 255, 0.06);
            box-shadow: 0 0 8px rgba(0,234,255,0.2);
        }

        select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3/polyline%3e%3/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 12px;
            padding-right: 35px;
        }
        
        select option { background-color: #1a1a1a; color: white; padding: 12px; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: var(--space-m);
        }
        
        .hidden-field { display: none; }

        /* --- 按鈕 --- */
        button#calcBtn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #007AFF, #00c6ff);
            color: white;
            border: none;
            border-radius: var(--radius-input);
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(0,114,255,0.3);
            font-family: inherit;
        }

        button#calcBtn:hover {
            background: linear-gradient(135deg, #007AFF, #00e0ff);
            box-shadow: 0 6px 16px rgba(0,114,255,0.4);
            transform: translateY(-1px);
        }
        
        button#calcBtn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(0,114,255,0.3);
        }

        /* --- 結果區塊 --- */
        .bw-result-panel {
            margin-top: 25px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            display: none;
            overflow: hidden;
            border: 1px solid var(--card-border);
        }

        .panel-header {
            background: rgba(255, 255, 255, 0.08);
            padding: 12px 15px;
            font-weight: 700;
            font-size: 15px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-primary);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-size: 14px;
            color: var(--text-secondary);
        }

        .result-row span:last-child { color: var(--text-primary); font-weight: 600; }

        .result-row.total {
            background: var(--bw-red-bg);
            border-top: 1px solid rgba(255, 85, 85, 0.3);
            margin-top: 2px;
            font-weight: 700;
        }
        .result-row.total span { color: var(--bw-red); }
        .red-text { color: var(--bw-red) !important; }

        /* --- 點數表格 --- */
        .pt-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin-top: 15px;
            margin-bottom: 5px;
        }
        .pt-table th {
            background: transparent;
            color: var(--text-secondary);
            padding: 8px;
            border: none;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }
        .pt-table td {
            padding: 10px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            text-align: left;
            color: var(--text-primary);
        }
        .pt-table tbody tr:last-child td { border-bottom: none; }
        .pt-table td:last-child { text-align: right; }

    </style>
</head>
