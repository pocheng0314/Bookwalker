<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BW 省錢大師</title>
    <style>
        :root {
            --bg: #050505;
            --card: #121212;
            --input: #1e1e1e;
            --accent: #00eaff;
            --text: #ffffff;
            --text-muted: #888888;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-wrapper {
            width: 100%;
            max-width: 400px;
        }

        h1 { font-size: 1.2rem; margin-bottom: 24px; text-align: center; opacity: 0.9; }

        .section {
            background: var(--card);
            border: 1px solid #222;
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

        label { font-size: 0.85rem; display: block; margin-bottom: 6px; }

        input, select {
            width: 100%;
            background: var(--input);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 12px;
            color: white;
            font-size: 1rem;
            outline: none;
        }

        input:focus { border-color: var(--accent); }

        .btn-calc {
            width: 100%;
            padding: 16px;
            background: white;
            color: black;
            border: none;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 10px;
            cursor: pointer;
        }

        .results {
            margin-top: 24px;
            padding: 20px;
            background: linear-gradient(180deg, #1a1a1a 0%, #050505 100%);
            border-radius: 20px;
            display: none;
        }

        .res-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .res-val { color: var(--accent); font-weight: 700; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <h1>BW 究極省錢大師</h1>

    <!-- 區塊1：基礎資訊 -->
    <div class="section">
        <div class="section-title">基礎設定</div>
        <label>會員等級</label>
        <select id="lv" style="margin-bottom:12px">
            <option value="0">LV.0 (0%)</option>
            <option value="1">LV.1 (1%)</option>
            <option value="2">LV.2 (2%)</option>
            <option value="4">LV.3 (4%)</option>
            <option value="7">LV.5 (7%)</option>
        </select>
        
        <div class="row">
            <div><label>原價</label><input type="number" id="origPrice" placeholder="0"></div>
            <div><label>小計</label><input type="number" id="subTotal" placeholder="0"></div>
        </div>
    </div>

    <!-- 區塊2：進階參數 -->
    <div class="section">
        <div class="section-title">折扣與回饋</div>
        <div class="row">
            <div><label>折價券 (%)</label><input type="number" id="couponVal" placeholder="85"></div>
            <div><label>點數折抵</label><input type="number" id="pointUsed" placeholder="0"></div>
        </div>
        <label>目標點數</label>
        <input type="number" id="bonusPt" placeholder="輸入目標點數">
    </div>

    <button class="btn-calc" onclick="calculate()">執行精算分析</button>

    <div id="resultPanel" class="results">
        <div class="res-item"><span>實付金額</span><span id="resPay" class="res-val">$0</span></div>
        <div class="res-item"><span>預估獲點</span><span id="resPt" class="res-val">0 點</span></div>
        <div class="res-item"><span>實際折數</span><span id="resRate" class="res-val">0.00 折</span></div>
    </div>
</div>

<script>
    function calculate() {
        const sub = parseFloat(document.getElementById('subTotal').value) || 0;
        const lvRate = parseFloat(document.getElementById('lv').value) / 100;
        const points = parseFloat(document.getElementById('pointUsed').value) || 0;
        const orig = parseFloat(document.getElementById('origPrice').value) || sub;
        
        let pay = Math.max(0, sub - points);
        let totalPt = Math.floor(sub * 0.01) + Math.floor(sub * lvRate);
        let rate = orig > 0 ? (pay / orig) * 10 : 0;

        document.getElementById('resPay').innerText = '$' + pay.toFixed(0);
        document.getElementById('resPt').innerText = totalPt + ' 點';
        document.getElementById('resRate').innerText = rate.toFixed(2) + ' 折';
        
        document.getElementById('resultPanel').style.display = 'block';
    }
</script>
</body>
</html>
